<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KRISHNACHARYA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Title Screen -->
    <div id="title-screen">
      <h1 class="game-title">KRISHNACHARYA</h1>
      <p class="subtitle">Endless Runner</p>
      <button id="start-btn">START GAME</button>
      <p class="controls">SPACE / CLICK / TAP to Jump</p>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
      <h1 class="game-title">KRISHNACHARYA</h1>
      <h2>GAME OVER</h2>
      <p id="final-score">Score: 0</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-title">KRISHNACHARYA</div>
      <div id="score">Score: 0</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
